name: Deploy AinuboX1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Render static homepage
        shell: bash
        run: |
          nohup npm run start -- --port 4173 >/tmp/vinext.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o dist/client/index.html; then
              break
            fi
            sleep 1
          done
          test -s dist/client/index.html
      - name: Add Pages marker
        run: touch dist/client/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
